<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}" data-theme="light">
<head>
    {{ partial "head.html" . }}
</head>
<body>
    {{ if not .IsHome }}
    <div class="reading-progress"></div>
    {{ end }}

    {{ if not (eq .Type "posts") }}
    {{ partial "header.html" . }}
    {{ end }}

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    {{ if not (eq .Type "posts") }}
    {{ partial "ambient-bar.html" . }}
    {{ end }}

    {{ $js := resources.Get "js/main.js" | minify }}
    <script>{{ $js.Content | safeJS }}</script>
</body>
</html>
