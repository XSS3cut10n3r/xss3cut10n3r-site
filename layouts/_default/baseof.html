<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
<head>
  {{ partial "head.html" . }}
  {{ if eq .Section "posts" }}
  <script>
    window.location.replace({{ "/" | relURL | jsonify | safeJS }} + '#post=' + encodeURIComponent(window.location.pathname + window.location.hash));
  </script>
  {{ end }}
</head>
<body>
  {{ if .IsPage }}<div class="reading-progress"></div>{{ end }}
  {{ partial "header.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ $js := resources.Get "js/site.js" | minify }}
  <script>{{ $js.Content | safeJS }}</script>
</body>
</html>
