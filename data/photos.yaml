# Photos for the homepage Photos panel, grouped by trip, newest trip first.
# The Photos tab only appears once there is at least one photo.
#
# To add a photo: put the full-size image in static/images/photos/ and a copy about
# 600px wide with the same file name in static/images/photos/thumbs/, then list it below.
# Optional per trip: crop: "4 / 3" shows every photo in that trip at the same shape.

- title: "Honduras"
  date: "Spring 2026"
  crop: "1 / 1"
  photos:
    - src: /images/photos/honduras-01.jpg
      caption: "A carved stela at Copán Ruinas"
      alt: "A weathered Maya stela carved with figures, with visitors on the ruins behind"
    - src: /images/photos/honduras-02.jpg
      caption: "Rosalila temple replica, Copán Sculpture Museum"
      alt: "A brightly painted red and green Maya temple facade seen through a dark entrance tunnel"
    - src: /images/photos/honduras-03.jpg
      caption: "Scarlet macaws"
      alt: "Two scarlet macaws perched among tropical plants"
    - src: /images/photos/honduras-04.jpg
      caption: "Green macaw"
      alt: "A green macaw with a red forehead perched on a wooden post"
    - src: /images/photos/honduras-05.jpg
      caption: "Cautious toucan"
      alt: "A black toucan with a large multicoloured bill standing on the ground"
    - src: /images/photos/honduras-06.jpg
      caption: "Sunset over the rooftops"
      alt: "Palm trees and a white church bell tower under a pink evening sky"
    - src: /images/photos/honduras-07.jpg
      caption: "A terrifyingly large dog"
      alt: "Two people sitting on a step beside a very large mastiff"
    - src: /images/photos/honduras-08.jpg
      caption: "Engineers"
      alt: "A tiled patio with a wood-fired oven, a fan, and potted tropical plants"

